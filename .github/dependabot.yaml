version: 2

updates:
  # Keep dependencies for GitHub Actions up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep pnpm dependencies up-to-date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # type-coverage reads the TypeScript 6 compiler API, which the native
      # TypeScript 7 compiler no longer provides.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
