name: Frontend QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"

jobs:
  frontend-qa:
    name: Frontend QA
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads the full history.
          fetch-depth: 0
          persist-credentials: false

      # Vite+ provisions Node from .node-version and pnpm from packageManager.
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache-toolchain: true
          cache: true
          run-install: |
            args: [--frozen-lockfile, --, --loglevel=warn]

      - name: Install Playwright Chromium (Vitest browser mode)
        run: vp exec playwright install --with-deps chromium

      # The non-Lighthouse gates from `vp run qa`, with readable step logs.
      - name: Format, lint, and types
        run: vp check --deny-warnings --continue-on-error

      - name: Secret scan (gitleaks, full history)
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --log-opts="--all" --redact --no-banner --log-level=warn .

      - name: CSS code quality
        run: vp run css-quality

      - name: Unit tests and coverage
        run: vp test --coverage

      - name: Dependency audit
        run: vp pm audit -- --audit-level=moderate

      - name: Fallow (dead code, duplication, complexity)
        run: vp run fallow

      - name: Type coverage
        run: vp run type-coverage

      - name: Build
        run: vp build --logLevel warn

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage
            test-results
