name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"

jobs:
  qa:
    runs-on: ubuntu-latest
    # Lighthouse CI posts its results as commit statuses.
    permissions:
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ provisions Node from .node-version and pnpm from packageManager.
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache-toolchain: true
          cache: true
          run-install: false

      - name: Install dependencies
        run: |
          vp install --frozen-lockfile -- --loglevel=warn
          vp exec playwright install --with-deps chromium

      # The same gates as `vp run qa`, as separate steps with readable logs.
      - name: Format, lint, and types
        run: vp check --deny-warnings

      - name: CSS lint
        run: vp run lint:css

      - name: Unit tests and coverage
        run: vp test --coverage

      - name: Dependency audit
        run: vp pm audit -- --audit-level=moderate

      - name: Fallow (dead code, duplication, complexity)
        run: vp run fallow

      - name: Type coverage
        run: vp run type-coverage

      - name: Build
        run: vp build

      - name: End-to-end and accessibility tests
        run: vp exec playwright test

      - name: Lighthouse
        run: vp dlx @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ github.token }}

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage
            playwright-report
            test-results
