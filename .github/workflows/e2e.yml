name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache-toolchain: true
          cache: true
          run-install: |
            args: [--frozen-lockfile, --, --loglevel=warn]

      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps

      - name: End-to-end and accessibility tests
        run: vp exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
