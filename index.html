<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Save Indy! A JavaScript quiz adventure</title>
    <meta
      name="description"
      content="A retro browser game that tests your JavaScript knowledge: answer correctly to drive the snake back and save Indy."
    />
    <meta
      name="author"
      content="Indrajeet Patil"
    />
    <meta
      name="theme-color"
      content="#17110d"
    />
    <meta
      name="color-scheme"
      content="dark"
    />
    <link
      rel="canonical"
      href="https://www.indrapatil.com/save-indy/"
    />

    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:title"
      content="Save Indy! A JavaScript quiz adventure"
    />
    <meta
      property="og:description"
      content="Answer JavaScript questions to drive the snake back and save Indy."
    />
    <meta
      property="og:url"
      content="https://www.indrapatil.com/save-indy/"
    />
    <meta
      property="og:image"
      content="https://www.indrapatil.com/save-indy/og-image.png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:alt"
      content="Pixel-art explorer in a torch-lit temple facing a green snake."
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="Save Indy! A JavaScript quiz adventure"
    />
    <meta
      name="twitter:description"
      content="Answer JavaScript questions to drive the snake back and save Indy."
    />
    <meta
      name="twitter:image"
      content="https://www.indrapatil.com/save-indy/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Pixel-art explorer in a torch-lit temple facing a green snake."
    />

    <link
      rel="icon"
      href="./favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="./favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="./apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="./site.webmanifest"
    />
    <script
      type="module"
      src="./src/main.ts"
    ></script>
  </head>

  <body>
    <header class="site-header">
      <h1 class="title">Save Indy!</h1>
      <button
        type="button"
        class="icon-button"
        id="mute-toggle"
        aria-pressed="false"
        aria-label="Mute sound"
        title="Mute sound"
      >
        <span data-icon="soundOn"></span>
      </button>
    </header>

    <main class="layout">
      <section
        class="stage"
        aria-label="Temple"
      >
        <canvas
          id="scene"
          class="scene"
          width="160"
          height="120"
          role="img"
          aria-label="Indy stands in a torch-lit temple while a snake slithers towards him."
        ></canvas>
        <div class="hud">
          <div class="stat">
            <span class="stat-label"
              ><span data-icon="alert"></span
              ><span
                class="visually-hidden"
                id="threat-label"
                >Threat</span
              ></span
            >
            <div
              class="meter"
              id="threat-meter"
              role="meter"
              aria-labelledby="threat-label"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
            >
              <div class="meter-fill threat-fill"></div>
            </div>
            <span
              class="stat-value"
              id="threat-value"
              aria-hidden="true"
              >50</span
            >
          </div>
          <div class="stat">
            <span class="stat-label"
              ><span data-icon="heart"></span
              ><span
                class="visually-hidden"
                id="health-label"
                >Indy's health</span
              ></span
            >
            <div
              class="meter"
              id="health-meter"
              role="meter"
              aria-labelledby="health-label"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
            >
              <div class="meter-fill health-fill"></div>
            </div>
            <span
              class="stat-value"
              id="health-value"
              aria-hidden="true"
              >50</span
            >
          </div>
        </div>
      </section>

      <section
        class="panel"
        aria-label="Quiz"
      >
        <p
          class="visually-hidden"
          id="announcer"
          aria-live="polite"
        ></p>
        <div
          class="screen"
          id="start-screen"
        >
          <p class="lead">
            Answer JavaScript questions to save Indy from the snake.
          </p>
          <form
            class="start-form"
            id="start-form"
          >
            <fieldset class="levels">
              <legend>Level</legend>
              <div
                class="level-options"
                id="level-options"
              ></div>
            </fieldset>
            <button
              type="submit"
              class="button primary"
            >
              <span data-icon="play"></span>Start
            </button>
          </form>
        </div>

        <div
          class="screen"
          id="question-screen"
          hidden
        >
          <p
            class="progress"
            id="progress"
          ></p>
          <h2
            class="question"
            id="question"
            tabindex="-1"
          ></h2>
          <ol
            class="answers"
            id="answers"
          ></ol>
          <div
            class="feedback"
            id="feedback"
            hidden
          >
            <p
              class="verdict"
              id="verdict"
            ></p>
            <p
              class="right-answer"
              id="right-answer"
            ></p>
            <p
              class="explanation"
              id="explanation"
            ></p>
            <button
              type="button"
              class="button primary"
              id="next-button"
            >
              <span id="next-label">Next</span><span data-icon="next"></span>
            </button>
          </div>
          <p class="hint">
            <kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>Enter</kbd> next
          </p>
        </div>

        <div
          class="screen"
          id="end-screen"
          hidden
        >
          <h2
            class="result"
            id="result"
            tabindex="-1"
          ></h2>
          <p
            class="summary"
            id="summary"
          ></p>
          <div class="end-actions">
            <button
              type="button"
              class="button primary"
              id="play-again"
            >
              <span data-icon="retry"></span>Again
            </button>
            <button
              type="button"
              class="button"
              id="change-level"
            >
              <span data-icon="levels"></span>Levels
            </button>
          </div>
          <section
            class="review"
            id="review"
            aria-labelledby="review-heading"
            hidden
          >
            <h3 id="review-heading">Revisit</h3>
            <ol
              class="review-list"
              id="review-list"
            ></ol>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <nav
        class="toolbar"
        aria-label="Links"
      >
        <a
          class="icon-button"
          href="https://github.com/IndrajeetPatil/save-indy"
          aria-label="Source code on GitHub"
          title="Source code on GitHub"
          ><span data-icon="github"></span
        ></a>
        <a
          class="icon-button"
          href="https://github.com/IndrajeetPatil/save-indy/issues"
          aria-label="Report a wrong answer"
          title="Report a wrong answer"
          ><span data-icon="bug"></span
        ></a>
        <a
          class="icon-button"
          href="https://www.indrapatil.com/"
          aria-label="Made by Indrajeet Patil"
          title="Made by Indrajeet Patil"
          ><span data-icon="person"></span
        ></a>
      </nav>
      <p>
        <span>Unofficial fan game for learning JavaScript</span> ·
        <span>No money made</span> · <span>Not affiliated with Lucasfilm</span>
      </p>
    </footer>
  </body>
</html>
