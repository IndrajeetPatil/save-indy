<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- meta: general -->
    <meta name="description" content="A fun game built using JavaScript to check your knowledge of JavaScript itself!">
    <meta name="keywords" content="javascript, learning-game, knowledge-game, web-development">
    <meta name="author" content="Indrajeet Patil">

    <!-- meta: social media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Save Indy using JavaScript!">
    <meta property="og:description" content="A fun game built using JavaScript to check your knowledge of JavaScript itself!">
    <meta property="og:url" content="https://www.indrapatil.com/save-indy/">
    <meta property="og:image" content="https://www.indrapatil.com/save-indy/assets/home_background.jpeg">
    <meta property="og:image:alt" content="Indiana Jones banner">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="@patilindrajeets">
    <meta name="twitter:site" content="@patilindrajeets">

    <!-- link fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- link favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/favicon_io/favicon.ico">
    <link rel="apple-touch-icon" href="./assets/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="./assets/favicon_io/site.webmanifest">

    <!-- link local stylesheets -->
    <link rel="stylesheet" href="./styles/style.css">

    <title>Save Indy using JavaScript!</title>

</head>

<body>

    <main class="intro-container">

        <div class="intro-text-container">
            <div class="intro-images-container">
                <img class="home-banner" src="./assets/home_background.jpeg" alt="Indiana Jones banner">
                <img class="js-logo" src="./assets/js-logo.png" alt="JavaScript logo">
            </div>

            <h1>Save Indy!</h1>

            <p>Save Indiana Jones with your JavaScript knowledge.</p>
            <p>The more questions you answer correctly, the more he gets out of trouble.</p>

            <form class="start-form" action="./game/index.html" method="get">

                <div class="difficulty-level">
                    <label for="difficulty-level-options">Choose your proficiency level:</label>

                    <select class="difficulty-level-options" id="difficulty-level-options" name="level">
                        <option value="beginner" selected>Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <button type="submit" class="start-btn">Start</button>

            </form>

        </div>

        <div class="legal-footer">
            <p>
                This game is a fun way to test your JavaScript knowledge.
                I make no money from it.
            </p>
            <p>
                Please don't sue me, George Lucas!
            </p>
            <p>
                Created by <a href="https://github.com/IndrajeetPatil">Indrajeet Patil</a>
            </p>
        </div>

    </main>

</body>

</html>
