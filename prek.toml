minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-useless-excludes"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

# pnpm-lock.yaml holds several YAML documents.
[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1

# Scans the staged diff; frontend-qa.yml scans the full history.
[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "539ea2e1c5a0eb8adeb5fe0b1e2eb66fa5827042" # frozen: v0.3.5

[[repos.hooks]]
id = "rumdl-check"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "276087d9a4f06398b3e04825487805e2d7375888" # frozen: v1.52.2

[[repos.hooks]]
id = "typos"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0

# Strict mode also checks merge and fixup messages.
[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["--strict", "--verbose"]

[[repos]]
repo = "local"

# Type-aware linting resolves the app's own dependencies, so this hook runs
# against the locked node_modules from `vp install`.
[[repos.hooks]]
id = "vite-plus"
name = "Vite+ format, lint, and types"
language = "system"
entry = "vp check --deny-warnings --continue-on-error"
files = "\\.([cm]?[jt]sx?|json|css|html|md|ya?ml|toml)$"
pass_filenames = false
